<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="hex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a4d"/>
      <stop offset="1" stop-color="#0f1a35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee7df"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <clipPath id="hexclip">
      <polygon points="256,72 416,164 416,348 256,440 96,348 96,164"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- the enclave: a sealed hexagon -->
  <polygon points="256,72 416,164 416,348 256,440 96,348 96,164" fill="url(#hex)" stroke="url(#accent)" stroke-width="14" stroke-linejoin="round"/>

  <!-- portfolio bars, sealed inside; only partially visible -->
  <g clip-path="url(#hexclip)" opacity="0.95">
    <rect x="176" y="292" width="34" height="80" rx="6" fill="#5ee7df"/>
    <rect x="222" y="244" width="34" height="128" rx="6" fill="#4cc9f0"/>
    <rect x="268" y="268" width="34" height="104" rx="6" fill="#3b82f6"/>
    <rect x="314" y="216" width="34" height="156" rx="6" fill="#6366f1"/>
  </g>

  <!-- the seal: a padlock over the bars, meaning "you see the shape, not the rule" -->
  <g transform="translate(256,196)">
    <path d="M-30,0 v-22 a30,30 0 0 1 60,0 v22" fill="none" stroke="#e8f1ff" stroke-width="14" stroke-linecap="round"/>
    <rect x="-46" y="0" width="92" height="72" rx="14" fill="#e8f1ff"/>
    <circle cx="0" cy="30" r="9" fill="#0f1a35"/>
    <rect x="-4" y="30" width="8" height="20" rx="3" fill="#0f1a35"/>
  </g>
</svg>
