<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee7df"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="hex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a4d"/>
      <stop offset="1" stop-color="#0f1a35"/>
    </linearGradient>
    <clipPath id="hexclip">
      <polygon points="1440,200 1690,344 1690,632 1440,776 1190,632 1190,344"/>
    </clipPath>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- faint public trade ticks along the bottom: what observers see -->
  <g stroke="#3b82f6" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round">
    <path d="M120,940 h60 M220,940 h20 M300,940 h90 M430,940 h30 M500,940 h70 M610,940 h40 M690,940 h110 M840,940 h25 M905,940 h60"/>
  </g>
  <text x="120" y="985" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#8fa3c7" letter-spacing="2">PUBLIC: THE TRADES</text>

  <!-- title block -->
  <text x="120" y="360" font-family="Helvetica, Arial, sans-serif" font-size="112" font-weight="700" fill="#e8f1ff" letter-spacing="-2">Enclave Portfolio</text>
  <text x="120" y="450" font-family="Helvetica, Arial, sans-serif" font-size="44" fill="#b8c7e6">Trading strategies that run inside a Chainlink enclave.</text>
  <text x="120" y="512" font-family="Helvetica, Arial, sans-serif" font-size="44" fill="#b8c7e6">The trades are public. The logic never is.</text>

  <g font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#5ee7df" letter-spacing="3">
    <text x="120" y="620">CRE CONFIDENTIAL WORKFLOWS</text>
    <text x="120" y="664" fill="#8fa3c7" letter-spacing="1">confidential rebalancer  ·  automated liquidation protection  ·  ETHOnline 2026</text>
  </g>

  <!-- the enclave mark, large -->
  <polygon points="1440,200 1690,344 1690,632 1440,776 1190,632 1190,344" fill="url(#hex)" stroke="url(#accent)" stroke-width="20" stroke-linejoin="round"/>
  <g clip-path="url(#hexclip)" opacity="0.95">
    <rect x="1316" y="548" width="52" height="120" rx="8" fill="#5ee7df"/>
    <rect x="1386" y="476" width="52" height="192" rx="8" fill="#4cc9f0"/>
    <rect x="1456" y="512" width="52" height="156" rx="8" fill="#3b82f6"/>
    <rect x="1526" y="434" width="52" height="234" rx="8" fill="#6366f1"/>
  </g>
  <g transform="translate(1440,398)">
    <path d="M-46,0 v-34 a46,46 0 0 1 92,0 v34" fill="none" stroke="#e8f1ff" stroke-width="20" stroke-linecap="round"/>
    <rect x="-70" y="0" width="140" height="110" rx="20" fill="#e8f1ff"/>
    <circle cx="0" cy="46" r="13" fill="#0f1a35"/>
    <rect x="-6" y="46" width="12" height="30" rx="4" fill="#0f1a35"/>
  </g>
  <text x="1440" y="850" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#8fa3c7" letter-spacing="2">PRIVATE: THE STRATEGY</text>
</svg>
