<text x="590" y="27" text-anchor="middle" font-family="Menlo, Monaco, 'DejaVu Sans Mono', monospace" font-size="14" fill="#8b949e">bun run trace   (replays one enclave cycle in clear, for humans)</text>
<g font-family="Menlo, Monaco, 'DejaVu Sans Mono', monospace" font-size="17" xml:space="preserve">
<text x="36" y="100" fill="#8b949e">────────────────────────────────────────────────────────────────────────</text>
<text x="36" y="126" fill="#d2a8ff">3. SIGNALS  (secret: nothing below leaves the enclave)</text>
<text x="36" y="152" fill="#8b949e">────────────────────────────────────────────────────────────────────────</text>
<text x="36" y="178" fill="#e6edf3">  base -&gt; composed target:</text>
<text x="36" y="204" fill="#e6edf3">    0.0.1183558     20.00% -&gt;  13.95%  down</text>
<text x="36" y="230" fill="#e6edf3">    0.0.15058       50.00% -&gt;  26.05%  down</text>
<text x="36" y="256" fill="#e6edf3">    0.0.5449        30.00% -&gt;  60.00%  up  </text>
<text x="36" y="282" fill="#e6edf3"></text>
<text x="36" y="308" fill="#8b949e">────────────────────────────────────────────────────────────────────────</text>
<text x="36" y="334" fill="#d2a8ff">4. VALUATION AND DRIFT  (secret)</text>
<text x="36" y="360" fill="#8b949e">────────────────────────────────────────────────────────────────────────</text>
<text x="36" y="386" fill="#e6edf3">  book value  $10,000.00</text>
<text x="36" y="412" fill="#e6edf3"></text>
<text x="36" y="438" fill="#e6edf3">    token          value        now      target     drift     delta</text>
<text x="36" y="464" fill="#e6edf3">    SAUCE     $1,300.00    13.00%    13.95%     0.95%      $95.00</text>
<text x="36" y="490" fill="#e6edf3">    WHBAR     $6,200.00    62.00%    26.05%    35.95%  -$3,595.00</text>
<text x="36" y="516" fill="#e6edf3">    USDC      $2,500.00    25.00%    60.00%    35.00%   $3,500.00</text>
<text x="36" y="542" fill="#e6edf3"></text>
<text x="36" y="568" fill="#e6edf3">  max drift 35.95% vs threshold 5.00% -&gt; REBALANCE</text>
<text x="36" y="594" fill="#e6edf3"></text>
<text x="36" y="620" fill="#8b949e">────────────────────────────────────────────────────────────────────────</text>
<text x="36" y="646" fill="#d2a8ff">5. TRADE SIZING  (secret)</text>
<text x="36" y="672" fill="#8b949e">────────────────────────────────────────────────────────────────────────</text>
<text x="36" y="698" fill="#e6edf3">  per-trade cap 20.00% of book = $2,000.00</text>
<text x="36" y="724" fill="#e6edf3"></text>
<text x="36" y="750" fill="#e6edf3">    SELL WHBAR    $2,000.00   (wanted $3,595.00, CAPPED)</text>
<text x="36" y="776" fill="#e6edf3">    BUY  SAUCE       $95.00</text>
<text x="36" y="802" fill="#e6edf3"></text>
<text x="36" y="828" fill="#e6edf3">  0.0.5449 excluded: it is the quote token, a residual of the other legs</text>
<text x="36" y="854" fill="#e6edf3"></text>
<text x="36" y="880" fill="#8b949e">────────────────────────────────────────────────────────────────────────</text>
<text x="36" y="906" fill="#d2a8ff">6. PRICE-IMPACT CHECK  (secret threshold, enforced in-enclave)</text>
<text x="36" y="932" fill="#8b949e">────────────────────────────────────────────────────────────────────────</text>
<text x="36" y="958" fill="#e6edf3">    WHBAR  impact   0.04% vs cap 1.00%  -&gt;  keep</text>
<text x="36" y="984" fill="#e6edf3">    SAUCE  impact   0.10% vs cap 1.00%  -&gt;  keep</text>
<text x="36" y="1010" fill="#e6edf3"></text>
<text x="36" y="1036" fill="#8b949e">────────────────────────────────────────────────────────────────────────</text>
<text x="36" y="1062" fill="#d2a8ff">7. WHAT LEAVES THE ENCLAVE  (this, and only this, becomes public)</text>
<text x="36" y="1088" fill="#8b949e">────────────────────────────────────────────────────────────────────────</text>
<text x="36" y="1114" fill="#e6edf3">    SELL WHBAR    $2,000.00  min_out=1999200000</text>
<text x="36" y="1140" fill="#e6edf3">    BUY  SAUCE       $95.00  min_out=9490500000</text>
<text x="36" y="1166" fill="#e6edf3"></text>
<text x="36" y="1192" fill="#e6edf3">  Not emitted: the spec, the composed targets, drift, caps, signal</text>
<text x="36" y="1218" fill="#e6edf3">  parameters, weight bounds, or the impact threshold.</text>
</g></svg>