# staging  -> our PRIVATE copy of the challenge (we can move the price)
# production -> the OFFICIAL Chainlink contract
staging-settings:
  user-workflow:
    workflow-name: "liquidation-protection-staging"
    deployment-registry: "private"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: "../secrets.yaml"

production-settings:
  user-workflow:
    workflow-name: "liquidation-protection"
    deployment-registry: "private"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    secrets-path: "../secrets.yaml"
