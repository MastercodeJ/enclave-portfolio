# ==========================================================================
# SECRET ID -> ENVIRONMENT VARIABLE MAPPING
# ==========================================================================
# These are the values the Vault DON releases INTO the enclave. Both are part
# of the private strategy and must never be logged or returned from the TEE
# handler.
#
# Local simulation reads them from ../.env. A deployed workflow reads them
# from the Vault DON.
secretsNames:
  rebalancer_portfolio_api_key:
    - REBALANCER_PORTFOLIO_API_KEY

  # The entire portfolio design: universe, base allocation, signals,
  # constraints and policy. One document. See portfolio.ts for the schema
  #.
  rebalancer_portfolio_spec:
    - REBALANCER_PORTFOLIO_SPEC
  # The same shape, with Sepolia token addresses as ids, for the Uniswap venue.
  rebalancer_portfolio_spec_sepolia:
    - REBALANCER_PORTFOLIO_SPEC_SEPOLIA
  # Uniswap venue: the wallet that holds the portfolio and signs the swaps.
  rebalancer_private_key:
    - CRE_ETH_PRIVATE_KEY

  # --- liquidation protection ---------------------------------------------
  # The wallet that joined the challenge. Signs deposit()/repay() inside the enclave.
  liquidation_private_key:
    - CRE_ETH_PRIVATE_KEY
  # The protection policy: floor price, trigger/target hf, capital caps, cooldown.
  liquidation_policy:
    - LIQUIDATION_POLICY
